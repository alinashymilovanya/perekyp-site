services:
  bot:
    build: .
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./data:/app/data
    init: true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "iphone_monitor.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
