services:
  bot:
    build: .
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      DATABASE_PATH: /data/seen.sqlite3
      STATUS_PATH: /data/runtime-status.json
      LOG_PATH: /data/bot.log
      TELEGRAM_SESSION_PATH: /data/bot_mtproto
    volumes:
      - ./data:/data
    init: true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "iphone_monitor.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
